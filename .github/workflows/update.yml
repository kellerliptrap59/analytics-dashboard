
name: Update NBA Data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC, ~5-6 AM Eastern

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run your data collection script
      - name: Update NBA CSV files
        run: |
          python data/stats.py

      # Commit updated CSV files
      - name: Push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.csv

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update NBA data"
            git push
          else
            echo "No CSV changes detected."
          fi
